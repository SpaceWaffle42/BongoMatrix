<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matrix hub</title>
<link rel="icon" type="image/png" href="logo.png?size=32">
<link rel="apple-touch-icon" href="logo.png?size=180&amp;tile">
<style>
:root {
  --page:#0B0C0E; --head:#0E1013; --card:#131519; --well:#08090A; --raise:#1A1D22; --line:#22262C; --line-2:#2C3139;
  --text:#ECEEF1; --soft:#C9CED6; --muted:#9AA1AC; --amber:#FFB547; --amber-hover:#FFCB7A; --ink:#1A1300;
  --amber-bg:#2A2114; --danger:#FF8A92; --good:#7BE0A6;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  color-scheme: dark;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--text); font:15px/1.45 var(--ui); }
header { padding:12px 16px; background:var(--head); border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
header img, .name img { width:32px; height:32px; image-rendering:pixelated; flex:none; }
.grow { flex:1 1 auto; }
.pick { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
.pick button { min-height:40px; padding:0 14px; background:var(--raise); color:var(--text); border:1px solid var(--line-2); font:600 13px var(--ui); cursor:pointer; margin-left:-1px; }
.pick button[aria-pressed=true] { background:var(--amber-bg); border-color:var(--amber); color:var(--amber); position:relative; }
header h1 { font-size:20px; margin:0; font-weight:700; }
header p { margin:0; color:var(--muted); font-size:13px; }
main { padding:16px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); max-width:1200px; margin:0 auto; }
.card { background:var(--card); border:1px solid var(--line); display:flex; flex-direction:column; }
.screen { background:#000; aspect-ratio:2 / 1; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--line); }
.screen img { width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
.screen .none { color:var(--muted); font-size:13px; }
.body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
.name { font-size:17px; font-weight:650; display:flex; gap:8px; align-items:center; }
.name .who { flex:1 1 0; min-width:0; overflow-wrap:anywhere; }
.addr { font:13px var(--mono); color:var(--muted); }
.playing { color:var(--soft); }
.meta { font-size:13px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.badge { font-size:11px; font-weight:650; padding:1px 7px; border:1px solid var(--line-2); color:var(--soft); }
.badge.update { border-color:var(--amber); color:var(--amber); background:var(--amber-bg); }
.badge.hub { color:var(--good); border-color:var(--good); }
.warn { color:var(--danger); font-size:13px; }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--good); }
.dot.off { background:var(--danger); }
.acts { margin-top:auto; display:flex; gap:8px; flex-wrap:wrap; }
.btn { background:var(--amber); color:var(--ink); border:1px solid var(--amber); padding:9px 14px;
  font:600 14px var(--ui); text-decoration:none; }
.btn:hover { background:var(--amber-hover); }
.btn.plain { background:var(--raise); color:var(--text); border-color:var(--line-2); }
.btn.plain:hover { background:#20242A; border-color:#3A3F47; }
.soft { overflow-wrap:anywhere; } .small-id { font-size:11px; opacity:.8; } .number { overflow-wrap:anywhere; } .tail, .meta > span:first-child { white-space:nowrap; } .ready { color:var(--amber); }
.empty { color:var(--muted); grid-column:1 / -1; padding:40px 0; text-align:center; }
footer { color:var(--muted); font-size:12px; text-align:center; padding:8px 16px 24px; }
</style>
</head>
<body>
<header>
  <img id="logo" alt="" width="32" height="32" onerror="this.hidden=true" onload="this.hidden=false">
  <h1>Matrix hub</h1>
  <p id="sub">Every Matrix on this network</p>
  <span class="grow"></span>
  <div class="pick" role="group" aria-label="View"><span>View</span><span><button type="button" id="logo-normal" aria-pressed="true" title="Each Matrix's live picture, and the round-wall logo">Normal</button><button type="button" id="logo-simple" aria-pressed="false" title="Just the details: no pictures, and the three-block logo (easier to tell apart when small)">Simple</button></span></div>
</header>
<main id="cards" aria-live="polite"><p class="empty">Looking for Matrices…</p></main>
<footer>Read-only: open a Matrix's dashboard to change or update it. Each one pairs on its own.</footer>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let tick = 0;
// the view, remembered by this browser: Normal (each Matrix's live picture, the round-wall logo) or Simple (just the
// details on each card, no pictures, and the three-block logo)
let style = 'normal', shown = [];
try { if (localStorage.getItem('bongo-logo') === 'simple') style = 'simple'; } catch { /* no storage: Normal */ }
function setStyle(s, keep) {
  style = s;
  if (keep) try { localStorage.setItem('bongo-logo', s); } catch { /* it just isn't remembered */ }
  $('logo').src = `logo.png?size=32&style=${s}`;
  $('logo-normal').setAttribute('aria-pressed', String(s === 'normal')); $('logo-simple').setAttribute('aria-pressed', String(s === 'simple'));
  if (shown.length) $('cards').innerHTML = shown.map(card).join('');
}

function ago(s) {
  if (s == null) return 'not heard from yet';
  if (s < 10) return 'just now';
  if (s < 90) return `${s} s ago`;
  return `${Math.round(s / 60)} min ago`;
}

/** A Matrix's version as people are shown it, in the plain style of its own Settings › Software card: "v1.0.0 · 25 Nov 2026"
 *  and its short build small beside it. All of it came over the network from another device, so it is checked again
 *  here (a label and a day of a known shape, nothing else) and escaped. A build that sends no label is older than the
 *  public numbering: "older build". */
const LABEL = /^v[0-9][0-9A-Za-z._-]{0,45}$/, DAY = /^\d{4}-\d{2}-\d{2}$/, BUILD = /^[0-9a-f]{7,12}$/;
function versionText(m, off) {
  const label = typeof m.label === 'string' && LABEL.test(m.label) ? m.label : null;
  const day = typeof m.date === 'string' && DAY.test(m.date) ? new Date(`${m.date}T12:00:00Z`) : null;
  const real = day && !Number.isNaN(day.getTime()) && day.getUTCFullYear() >= 1970 && day.toISOString().slice(0, 10) === m.date;   // (not 2026-02-30)
  const date = real ? day.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }).replace(/\s/g, '\u00a0') : '';
  const build = !off && typeof m.build === 'string' && BUILD.test(m.build) ? ` <span class="small-id">(${esc(m.build)})</span>` : '';
  if (label) return `<span>${esc(label)}${date ? ` · ${esc(date)}` : ''}${build}</span>`;
  // no label: a public number (the hub says so: older === false) is shown as it is; anything else, from before the public numbering or no number at all, is just "older build"
  return m.older === false && typeof m.version === 'string' && m.version.length <= 20 && /^\d+(\.\d+){0,3}$/.test(m.version)
    ? `<span class="number">${esc(`v${m.version}`)}${build}</span>` : `<span class="tail">· older build</span>`;
}

/** What a card says about its Matrix's software, and whether it gets an Update… button. A Matrix says for itself
 *  whether a new version is ready (update: true or false, from its own daily look). An older build says nothing:
 *  its card shows what it always did (the version, and a badge when another Matrix here runs a newer one) and has
 *  no button. Nor has one that isn't answering, or one that is updating now. */
function software(m) {
  const off = !!m.error;
  // its build is its version, as its own Settings › Software names it; an older build only has the number it announces
  const version = versionText(m, off);
  if (!off && m.updating === true) return { ready: false, line: `<span class="soft">${version}<span class="tail"> · <span class="ready">updating…</span></span></span>` };
  if (!off && m.update === true) return { ready: true, line: `<span class="soft">${version}<span class="tail"> · <span class="ready">update available</span></span></span>` };
  if (!off && m.update === false) return { ready: false, line: `<span class="soft">${version}<span class="tail"> · up to date</span></span>` };
  return { ready: false, line: `<span>${version}</span>${m.behind ? '<span class="badge update">update available</span>' : ''}` };
}
/** Update… only opens that Matrix's own dashboard at Settings › Software, with the update ready to confirm: the hub
 *  can't update anything itself. The link says where to go and nothing else. */
const updateLink = (m) => `${m.url}settings#update`;

function card(m) {
  const off = !!m.error;
  const soft = software(m);
  const picture = style === 'simple' ? null   // (Simple: just the details, and no picture fetched every 5 s)
    : off ? '<span class="none">No picture</span>'
    : m.picture === false ? '<span class="none">Picture turned off</span>'
    : `<img alt="What ${esc(m.name)} is showing" src="${esc(m.url)}api/public/frame.png?t=${tick}">`;
  const warnings = off ? [m.error] : [...(m.warnings || []), ...(soft.ready && m.rolled_back === true ? ['Last try rolled back: it didn\'t start'] : [])];
  return `<article class="card">
    ${picture === null ? '' : `<div class="screen">${picture}</div>`}
    <div class="body">
      <div class="name">${m.badge ? `<img src="logo.png?size=32&amp;style=${style}&amp;colour=${esc(m.badge)}" alt="" width="32" height="32" onerror="this.hidden=true">` : ''}<span class="who">${esc(m.name)}</span>${m.hub ? '<span class="badge hub" title="This Matrix answers at matrix.local">hub</span>' : ''}</div>
      <div class="addr">${esc(m.address)}${m.port && m.port !== 80 ? ':' + esc(m.port) : ''}</div>
      <div class="playing">${off ? '—' : m.sleeping ? 'Asleep' : m.paused ? `Paused · ${esc(m.playing || '')}` : esc(m.playing || 'Starting')}</div>
      <div class="meta"><span><span class="dot${off ? ' off' : ''}"></span> ${ago(m.seen_ago)}</span>
        ${soft.line}</div>
      ${warnings.map((w) => `<div class="warn">${esc(w)}</div>`).join('')}
      <div class="acts">${soft.ready ? `<a class="btn" href="${esc(updateLink(m))}" rel="noopener" title="Opens ${esc(m.name)}'s own dashboard at Settings › Software, with the update ready to confirm. Your browser pairs with it there first if it hasn't already.">Update…</a>` : ''}<a class="btn${soft.ready ? ' plain' : ''}" href="${esc(m.url)}" rel="noopener">Open dashboard</a></div>
    </div>
  </article>`;
}

async function load() {
  tick += 1;
  try {
    const res = await fetch('/api/hub', { headers: { Accept: 'application/json' } });
    const data = await res.json();
    const via = new URLSearchParams(location.search).has('via');
    if (!data.hub && data.leader && data.leader.address && !via) {   // another Matrix is the hub: go there, once
      location.replace(`http://${encodeURIComponent(data.leader.address)}:${Number(data.leader.port) || 80}/hub?via=1`);
      return;
    }
    const list = data.matrices || [];
    const ready = list.filter((m) => software(m).ready).length;
    $('sub').textContent = list.length ? `${list.length} Matri${list.length === 1 ? 'x' : 'ces'} on this network${ready ? ` · ${ready} ${ready === 1 ? 'has' : 'have'} an update` : ''}`
      : 'Every Matrix on this network';
    shown = list;
    $('cards').innerHTML = list.length ? list.map(card).join('')
      : `<p class="empty">${data.available === false ? 'The hub isn\'t running on this Matrix.' : 'Looking for Matrices…'}</p>`;
  } catch {
    $('sub').textContent = 'Can\'t reach the hub right now; trying again';
  }
}
$('logo-normal').onclick = () => setStyle('normal', true); $('logo-simple').onclick = () => setStyle('simple', true);
setStyle(style);
load(); setInterval(load, 5000);
</script>
</body>
</html>
