# Installed beside the device's original matrix-web.service so the dashboard's
# Restart device button can publish its fixed request (#33, 2026-10-11).
# RestartRequest requires the submit directory (root:matrix-web 1730, from
# matrix-device-restart.conf) to be in the process's own group, and the unit must
# be allowed to write there. The broker's root-only state stays hidden.
# Nothing else changes: same root user, capabilities, /proc view and devices.
[Service]
Group=matrix-web
ReadWritePaths=/run/matrix-device-restart/submit
InaccessiblePaths=/run/matrix-device-restart/state
