workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^archive\//
      when: never
    - if: $CI_COMMIT_BRANCH == "prod_device"   # built by publish_prod below; it has no tests to run
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [test, publish]

test:
  stage: test
  image: python:3.13-slim
  variables:
    BONGO_OFFLINE: "1"  # modules never fetch live data in CI
  script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null  # the updater's tests use real git
    - pip install --quiet -r requirements.txt pytest
    - python -m bongo list
    - python -m pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 14 days

# After every green main: rebuild prod_device (only the files a display needs) for devices to
# update from. Needs a project access token with write_repository saved as the masked CI/CD
# variable PROD_PUSH_TOKEN; without it this job is skipped.
publish_prod:
  stage: publish
  image: python:3.13-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PROD_PUSH_TOKEN
  variables:
    GIT_DEPTH: "0"
  script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - export PROD_PUSH_URL="${CI_SERVER_PROTOCOL}://oauth2:${PROD_PUSH_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_PATH}.git"
    - sh tools/publish_prod.sh
