workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^archive\//
      when: never
    - if: $CI_COMMIT_BRANCH

test:
  image: python:3.13-slim
  variables:
    BONGO_OFFLINE: "1"  # modules never fetch live data in CI
  script:
    - pip install --quiet -r requirements.txt pytest
    - python -m bongo list
    - python -m pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 14 days
