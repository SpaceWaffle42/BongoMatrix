# Project-owned GitLab pipeline. It deliberately replaces generic Auto DevOps:
# this repository is a Raspberry Pi application, not a container deployment.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - when: never

stages:
  - validate
  - test
  - quality
  - security
  - summary
  - physical

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  SECRET_DETECTION_ENABLED: "true"
  AST_ENABLE_MR_PIPELINES: "true"

.default_project_job:
  image: python:3.12-bookworm
  tags:
    - matrix-docker
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

python_syntax:
  extends: .default_project_job
  stage: validate
  script:
    - >-
      test -f deploy/matrix-device-restart.conf &&
      test -f deploy/matrix-device-restart.path &&
      test -f deploy/matrix-device-restart.service &&
      test -f deploy/matrix_device_restart_broker.py &&
      test -f deploy/matrix-ci-physical.conf
    - >-
      python -c 'import ast, pathlib;
      files = sorted(pathlib.Path(".").rglob("*.py"));
      [ast.parse(path.read_text(encoding="utf-8"), filename=str(path)) for path in files];
      print(f"parsed {len(files)} Python files")'

full_test_suite:
  extends: .default_project_job
  image: node:22-bookworm
  stage: test
  # The pixel-editor browser journeys add about two minutes to the prior
  # canonical runtime; keep a narrow margin below the project 60-minute cap.
  timeout: 60m
  variables:
    MATRIX_CHROMIUM: /usr/bin/chromium
  before_script:
    - apt-get update -qq
    # The sanitizer tests invoke /usr/bin/python3 directly, outside .venv-ci.
    # Keep Pillow and OpenCV available to that deliberately unprivileged process.
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends chromium ffmpeg openssh-server python3 python3-venv python3-pil python3-opencv
    # Install a regular copy because the verifier pins and O_NOFOLLOW-opens /usr/bin/node.
    - install -o root -g root -m 0755 /usr/local/bin/node /usr/bin/node
    - test ! -L /usr/bin/node
    - cmp -s /usr/local/bin/node /usr/bin/node
    - /usr/bin/node -e "if (typeof WebSocket !== 'function') process.exit(1)"
    - install -d -m 0755 /run/sshd
    - rm -rf -- .venv .venv-ci
    - python3 -m venv .venv-ci
    - ln -sT .venv-ci .venv
    - test "$(readlink .venv)" = ".venv-ci"
    - .venv-ci/bin/python -m pip install -r requirements.txt coverage unittest-xml-reporting
  script:
    - mkdir -p test-results
    # Collect every owning module before the long suite; missing behavior/import
    # errors/duplicate or foreign cases fail without weakening full discovery.
    - .venv-ci/bin/python scripts/ci_collection.py --output collection.json
    - |
      set +e
      .venv-ci/bin/coverage run --source=. --omit='tests/*' -m xmlrunner discover -s tests -o test-results
      test_status=$?
      set -e
      if [ "$test_status" -eq 0 ]; then
        .venv-ci/bin/coverage report --show-missing
        .venv-ci/bin/coverage xml -o coverage.xml
      else
        .venv-ci/bin/coverage report --show-missing || true
        .venv-ci/bin/coverage xml -o coverage.xml || true
      fi
      exit "$test_status"
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit:
        - test-results/*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - test-results/
      - collection.json

python_static_analysis:
  extends: .default_project_job
  stage: quality
  before_script:
    - python -m pip install 'ruff>=0.12,<1'
  script:
    - ruff check --select E9,F63,F7,F82 --output-format=gitlab --output-file=gl-code-quality-report.json .
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json

dependency_audit:
  extends: .default_project_job
  stage: quality
  before_script:
    - python -m pip install 'pip-audit>=2.9,<3'
  script:
    - pip-audit -r requirements.txt --format=json --output=dependency-audit.json
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dependency-audit.json

semgrep-sast:
  stage: security
  tags:
    - matrix-docker
  interruptible: true

secret_detection:
  stage: security
  tags:
    - matrix-docker
  interruptible: true

ci_summary:
  extends: .default_project_job
  stage: summary
  when: always
  before_script:
    - python -m pip install --no-cache-dir defusedxml==0.7.1
  needs:
    - job: full_test_suite
      artifacts: true
    - job: python_static_analysis
      artifacts: true
    - job: dependency_audit
      artifacts: true
    - job: semgrep-sast
      artifacts: true
      optional: true
    - job: secret_detection
      artifacts: true
      optional: true
  script:
    - >-
      python scripts/ci_summary.py
      --root .
      --baseline ci/sast-baseline.json
      --expected-baseline-source 8b9994024098320fbea99d92c117036c918fede4
      --json-output ci-summary.json
      --text-output ci-summary.txt
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-summary.json
      - ci-summary.txt

physical_device_acceptance:
  extends: .default_project_job
  stage: physical
  image: python:3.12-bookworm
  interruptible: false
  retry: 0
  resource_group: matrix-physical-device
  timeout: 3m
  needs:
    - job: ci_summary
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-client util-linux
    - useradd --uid 65532 --user-group --no-create-home --shell /usr/sbin/nologin matrix-ci-unprivileged
    - install -d -m 0700 "$HOME/.ssh"
    - install -m 0600 "$MATRIX_DEVICE_SSH_KEY" "$HOME/.ssh/matrix-device"
    - install -m 0600 "$MATRIX_DEVICE_KNOWN_HOSTS" "$HOME/.ssh/known_hosts"
  script:
    - |
      set -Eeuo pipefail
      [[ "$CI_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
      [[ "$CI_PIPELINE_ID" =~ ^[0-9]+$ ]]
      SSH=(ssh -i "$HOME/.ssh/matrix-device" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
      set +e
      "${SSH[@]}" "$MATRIX_DEVICE_TARGET" "verify $CI_COMMIT_SHA $CI_PIPELINE_ID" | head -c 4097 > physical-device-report.txt
      acceptance_status="${PIPESTATUS[0]}"
      overflow_status=0
      if [[ "$(wc -c < physical-device-report.txt)" -gt 4096 ]]; then
        overflow_status=1
      fi
      primary_status="$acceptance_status"
      if [[ "$primary_status" -eq 0 && "$overflow_status" -ne 0 ]]; then
        primary_status="$overflow_status"
      fi
      report_status=0
      if [[ "$overflow_status" -eq 0 ]]; then
        setpriv --reuid=65532 --regid=65532 --clear-groups python scripts/verify_physical_device_report.py --report physical-device-report.txt --source-sha "$CI_COMMIT_SHA" --pipeline-id "$CI_PIPELINE_ID"
        report_status=$?
      fi
      if [[ "$primary_status" -eq 0 && "$report_status" -ne 0 ]]; then
        primary_status="$report_status"
      fi
      set -e
      test "$primary_status" -eq 0
      exit "$primary_status"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - physical-device-report.txt
