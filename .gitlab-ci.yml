# Project-owned GitLab pipeline. It deliberately replaces generic Auto DevOps:
# this repository is a Raspberry Pi application, not a container deployment.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - when: never

stages:
  - validate
  - test
  - quality
  - security

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  SECRET_DETECTION_ENABLED: "true"
  AST_ENABLE_MR_PIPELINES: "true"

.default_project_job:
  image: python:3.12-bookworm
  tags:
    - matrix-docker
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

python_syntax:
  extends: .default_project_job
  stage: validate
  script:
    - >-
      python -c 'import ast, pathlib;
      files = sorted(pathlib.Path(".").rglob("*.py"));
      [ast.parse(path.read_text(encoding="utf-8"), filename=str(path)) for path in files];
      print(f"parsed {len(files)} Python files")'

full_test_suite:
  extends: .default_project_job
  image: node:22-bookworm
  stage: test
  timeout: 20m
  variables:
    MATRIX_CHROMIUM: /usr/bin/chromium
  before_script:
    - apt-get update -qq
    # The sanitizer tests invoke /usr/bin/python3 directly, outside .venv-ci.
    # Keep Pillow and OpenCV available to that deliberately unprivileged process.
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends chromium ffmpeg python3 python3-venv python3-pil python3-opencv
    - python3 -m venv .venv-ci
    - .venv-ci/bin/python -m pip install -r requirements.txt coverage unittest-xml-reporting
  script:
    - mkdir -p test-results
    - |
      set +e
      .venv-ci/bin/coverage run --source=. --omit='tests/*' -m xmlrunner discover -s tests -o test-results
      test_status=$?
      set -e
      if [ "$test_status" -eq 0 ]; then
        .venv-ci/bin/coverage report --show-missing
        .venv-ci/bin/coverage xml -o coverage.xml
      else
        .venv-ci/bin/coverage report --show-missing || true
        .venv-ci/bin/coverage xml -o coverage.xml || true
      fi
      exit "$test_status"
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit:
        - test-results/*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - test-results/

python_static_analysis:
  extends: .default_project_job
  stage: quality
  before_script:
    - python -m pip install 'ruff>=0.12,<1'
  script:
    - ruff check --select E9,F63,F7,F82 --output-format=gitlab --output-file=gl-code-quality-report.json .
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json

dependency_audit:
  extends: .default_project_job
  stage: quality
  before_script:
    - python -m pip install 'pip-audit>=2.9,<3'
  script:
    - pip-audit -r requirements.txt --format=json --output=dependency-audit.json
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dependency-audit.json

semgrep-sast:
  stage: security
  tags:
    - matrix-docker
  interruptible: true

secret_detection:
  stage: security
  tags:
    - matrix-docker
  interruptible: true
